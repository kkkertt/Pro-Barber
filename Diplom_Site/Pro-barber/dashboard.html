<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./source/scss/dashboard.css">
    <title>Админ-панель</title>
</head>
<body>
    <div class="sidebar">
        <h2>Меню</h2>
        <a href="#" data-page="home">Главная</a>
        <a href="#" data-page="reviews">Отзывы</a>
        <a href="#" data-page="requests">Заявки</a>
        <a href="#" data-page="services">Услуги</a>
    </div>
    <div class="content" id="content">
			<div id="message" class="message"></div>
			<div id="modal" class="modal" style="display: none;">
				<div class="modal-content">
						<span class="close-modal" id="close-modal">×</span>
						<h2>Редактирование услуги</h2>
						<form id="edit-service-form">
								<input type="hidden" id="service-id" name="id">
								<label for="name">Название:</label>
								<input type="text" id="name" name="name" required><br>
								<label for="price">Цена:</label>
								<input type="number" id="price" name="price" required><br>
								<label for="description">Описание:</label>
								<textarea id="description" name="description" required></textarea><br>
								<label for="image_url">URL изображения:</label>
								<input type="text" id="image_url" name="image_url" required><br>
								<button type="submit">Сохранить изменения</button>
						</form>
				</div>
		</div>
    </div>
    <script src="./source/js/dashboard.js"></script>
		<script src="./source/js/requests.js"></script>
		<script src="./source/js/services.js"></script>
</body>
</html>
